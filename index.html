<html lang="ja">
<head>

<style>
:root{color-scheme:dark;--ink:#dcecf6;--blue:#3cbcfc;--bg:#070b1b;--edge:#22365d}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 14%,#182853 0,#080e21 48%,#050713 100%);color:var(--ink);font-family:ui-monospace,Consolas,'Courier New',monospace;display:flex;justify-content:center;align-items:center;padding:16px}
.shell{width:min(100%,940px);text-align:center}
.heading{font-size:12px;letter-spacing:.3em;font-weight:900;margin:0 0 12px;color:#a4e4fc;text-shadow:0 0 18px #3cbcfc70}
.panel{margin:auto;width:fit-content;max-width:100%;padding:6px;background:#020611;border:2px solid #314b77;box-shadow:0 0 0 2px #0d182f,0 15px 45px #000c;line-height:0}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#0000bc;width:min(768px,calc(100vw - 50px),calc((100dvh - 190px) * 1.0666667));height:auto;aspect-ratio:256/240;touch-action:none;outline:none}
.status{font-size:11px;line-height:1.65;color:#96a9c6;letter-spacing:.04em;margin:12px auto 8px}
kbd{display:inline-block;background:#172543;color:#e3f5ff;border:1px solid #3b5481;border-bottom-width:3px;border-radius:4px;padding:1px 5px;font:inherit;margin-inline:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin:10px 0 0}
.tools button,.pad button{cursor:pointer;background:#172543;color:#dcecf6;border:1px solid #45618c;font:700 12px ui-monospace,monospace;border-radius:7px;padding:8px 13px;touch-action:none;user-select:none}
.tools button:hover,.pad button:active,.pad button.down{background:#2e5492;color:white}
.pad{display:none;justify-content:space-between;max-width:410px;margin:12px auto 0;gap:22px;align-items:center}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,43px);gap:4px}.dpad button{padding:0;font-size:19px;min-height:40px}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.dpad .down{grid-column:2;grid-row:3}
.fire{width:86px;height:86px;border-radius:50%!important;background:#923a45!important;border:3px solid #f87858!important;box-shadow:0 5px #4e1d33;font-size:16px!important}
.foot{font-size:10px;color:#7185a2;margin-top:12px}
@media(hover:none),(pointer:coarse){body{align-items:flex-start;padding:9px}.pad{display:flex}.heading{margin:0 0 6px}.status{font-size:10px;margin:8px auto 4px}canvas{width:min(100%,calc(100vw - 40px),calc(65dvh * 1.0666667))}.foot{display:none}}

function renderEnemies(){let arr=enemies.slice().sort((a,b)=>b.z-a.z);for(let e of arr){let p=project(e),im=sprites[e.type],scale=e.type==='boss'?1.30:p.s;if(p.x<-90||p.x>W+90||p.y<-90||p.y>H+65)continue;if(e.hit>0){sprite(im,p.x-im.width*scale/2,p.y-im.height*scale/2,scale);rect(p.x-3,p.y-3,6,6,C.WHITE);}else sprite(im,p.x-im.width*scale/2,p.y-im.height*scale/2,scale,Math.sin(e.time*3+e.seed)>0.65);
 if(e.type==='boss'&&state==='play'){rect(55,21,146,9,C.K);rect(57,23,142,5,C.DARKRED);rect(57,23,142*clamp(e.hp/(16+stage*6),0,1),5,C.ORANGE);print('CORE',7,22,C.WHITE);}
 }}
function renderBullets(){for(let b of bullets){let s=clamp(1-b.age/b.life,0,1);rect(b.x-1,b.y-2,4+Math.round(s*2),4+Math.round(s*2),C.DARKRED);rect(b.x,b.y-1,3,3,C.YELLOW);rect(b.x+1,b.y,1,1,C.WHITE);}
 for(let b of hostile){rect(b.x-3,b.y-3,7,7,C.DARKRED);rect(b.x-2,b.y-2,5,5,C.PINK);rect(b.x-1,b.y-1,3,3,C.WHITE);}}
function renderPlayer(clock){let {x,y}=player;if(player.invuln>0&&Math.floor(clock*13)%2)return;
 rect(x-9,y+10,20,3,C.NAVY); // crisp arcade drop shadow
 const flame=(Math.floor(clock*15)%2)?3:6;
 rect(x-6,y+13,4,flame,C.ORANGE);rect(x+4,y+13,4,flame+2,C.YELLOW);
 const im=Math.floor(clock*9)%2?sprites.pilot:sprites.pilot2;
 sprite(im,x-im.width/2+Math.round(player.bank*2),y-im.height/2,1,player.bank<-.4);
 if((pressed.has('Space')||pressed.has('KeyZ')||pressed.has('KeyJ')||touchFire||padControl.fire)&&Math.floor(clock*17)%2===0){rect(x+10,y-13,5,4,C.ORANGE);rect(x+15,y-12,4,2,C.YELLOW);}
}
function renderParticles(){for(let p of particles)rect(p.x,p.y,p.size,p.size,p.color);for(let t of texts){print('+'+t.points,t.x,t.y,C.YELLOW,1,'center');}}
function ui(){rect(0,0,W,13,C.K);rect(0,12,W,1,C.GREY);print('SCORE '+String(score).padStart(7,'0'),4,3,C.WHITE);print('ST '+(stage+1),133,3,C.YELLOW);print('LIFE '+Math.max(0,lives),192,3,C.PALEBLUE);
 if(stageMessage>0){if(bossMade&&!bossDead){rect(69,42,118,15,C.K);boxLine(69,42,118,15,C.PINK);print('BOSS APPROACH',128,46,C.YELLOW,1,'center');}else{rect(42,35,172,32,C.K);boxLine(42,35,172,32,C.PALEBLUE);print('STAGE '+(stage+1),128,40,C.YELLOW,2,'center');print(themes[stage].name,128,57,C.WHITE,1,'center');}}
 if(bossDead){print('STAGE CLEAR!',128,38,C.YELLOW,2,'center');}
}
function titleBackground(){let old=stage;stage=0;const theme=themes[0];backdrop(theme,titleTime*.6);floor(theme);stage=old;
 // Distant arch and hovering silhouette to give a moving title-screen diorama.
 sprite(sprites.drone,31+Math.sin(titleTime*1.1)*12,135+Math.sin(titleTime*2)*7,1.5);
 sprite(sprites.pilot,185+Math.cos(titleTime*1.3)*5,151+Math.sin(titleTime*1.9)*4,1.55);
 rect(16,18,224,115,C.NAVY);boxLine(16,18,224,115,C.SKY);
 rect(21,22,214,107,C.PURPLE);rect(26,27,204,97,C.NAVY);
 for(let i=0;i<17;i++){let x=31+i*12,y=30+(i%3)*3;rect(x,y,2,1,i%2?C.WHITE:C.PALEBLUE);}
 print('ASTER',128,41,C.K,4,'center');print('ASTER',126,39,C.YELLOW,4,'center');
 print('RAIDER',128,74,C.K,4,'center');print('RAIDER',126,72,C.WHITE,4,'center');
 print('8 BIT 3D SHOOTER',128,110,C.CYAN,1,'center');
 rect(29,143,198,71,C.K);boxLine(29,143,198,71,C.ORANGE);
 print('FLY  /  DODGE  /  FIRE',128,153,C.YELLOW,1,'center');
 print('ARROWS OR WASD TO MOVE',128,170,C.WHITE,1,'center');
 print('SPACE / Z / PAD: A TO FIRE',128,181,C.WHITE,1,'center');
 if(Math.floor(titleTime*2)%2===0)print('ENTER / SPACE / PAD START',128,199,C.PALEBLUE,1,'center');
 print('HI '+String(hi).padStart(7,'0'),128,223,C.WHITE,1,'center');
}
function endScreen(won){let t=titleTime;let theme=themes[won?2:1];backdrop(theme,t);floor(theme);
 rect(20,32,216,170,C.K);boxLine(20,32,216,170,won?C.YELLOW:C.RED);
 if(won){print('ALL CLEAR!',128,48,C.YELLOW,2,'center');print('GALAXY SAVED',128,76,C.WHITE,1,'center');sprite(sprites.pilot,111,90,1.4);}
 else{print('GAME OVER',128,50,C.RED,2,'center');sprite(sprites.pilot,115,79,1.1);}
 print('SCORE '+String(score).padStart(7,'0'),128,133,C.WHITE,1,'center');
 print('BEST  '+String(hi).padStart(7,'0'),128,148,C.YELLOW,1,'center');
 if(Math.floor(t*2)%2===0)print('ENTER / PAD START TO RETRY',128,175,C.PALEBLUE,1,'center');
}
function draw(){g.imageSmoothingEnabled=false;g.save();if(state==='play'||state==='dying'){if(shake>0){g.translate(irnd(-Math.ceil(shake*.45),Math.ceil(shake*.45)),irnd(-Math.ceil(shake*.4),Math.ceil(shake*.4)));}}
 if(state==='title')titleBackground();else if(state==='over'||state==='win')endScreen(state==='win');else{
 let theme=themes[stage];backdrop(theme,sceneTime);floor(theme);renderScenery();renderEnemies();renderBullets();renderParticles();renderPlayer(gameTime);ui();
 if(flash>0&&Math.floor(gameTime*26)%2===0){boxLine(0,0,256,240,C.WHITE);boxLine(2,2,252,236,C.ORANGE);}
 if(state==='pause'){rect(48,81,160,73,C.K);boxLine(48,81,160,73,C.YELLOW);print('PAUSED',128,92,C.WHITE,2,'center');print('P / PAD START TO RESUME',128,125,C.PALEBLUE,1,'center');}
 }
 g.restore();}
let last=0;function loop(now){if(!last)last=now;let dt=clamp((now-last)/1000,0,.034);last=now;pollGamepad();update(dt);draw();requestAnimationFrame(loop);}
function handleDown(code,repeat=false){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(code)){}if(code==='Enter'||code==='NumpadEnter'){if(state==='title'||state==='over'||state==='win'){initAudio();start();}else if(state==='pause')togglePause();return;}
 if(code==='Space'||code==='KeyZ'){if(state==='title'||state==='over'||state==='win'){initAudio();start();pressed.add(code);return;}initAudio();}
 if(code==='KeyP'&&!repeat){togglePause();return;}
 if(code==='KeyM'&&!repeat){audio.muted=!audio.muted;$('mute').textContent=audio.muted?'♪ SOUND OFF':'♪ SOUND ON';if(!audio.muted)initAudio();return;}
 pressed.add(code);
}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','NumpadEnter','KeyZ','KeyP','KeyM'].includes(e.code))e.preventDefault();handleDown(e.code,e.repeat);});
window.addEventListener('keyup',e=>pressed.delete(e.code));window.addEventListener('blur',()=>{pressed.clear();touchFire=false;if(state==='play')state='pause';});
$('start').addEventListener('click',()=>{initAudio();start();canvas.focus();});
$('mute').addEventListener('click',()=>{audio.muted=!audio.muted;$('mute').textContent=audio.muted?'♪ SOUND OFF':'♪ SOUND ON';if(!audio.muted)initAudio();});
$('pause').addEventListener('click',()=>togglePause());
$('fullscreen').addEventListener('click',()=>{let p=document.querySelector('.panel');if(document.fullscreenElement)document.exitFullscreen?.();else p.requestFullscreen?.().catch(()=>{});});
for(let button of document.querySelectorAll('[data-key]')){const code=button.dataset.key;button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);button.classList.add('down');if(code==='Space')touchFire=true;handleDown(code);});const up=e=>{e.preventDefault();button.classList.remove('down');pressed.delete(code);if(code==='Space')touchFire=false;};button.addEventListener('pointerup',up);button.addEventListener('pointercancel',up);button.addEventListener('lostpointercapture',up);}
canvas.addEventListener('pointerdown',e=>{canvas.focus();initAudio();if(state==='title'||state==='over'||state==='win'){start();return;}if(state==='pause'){togglePause();return;}if(state==='play'){touchFire=true;pointerMove(e);canvas.setPointerCapture(e.pointerId);}});
canvas.addEventListener('pointermove',e=>{if(e.buttons&&state==='play')pointerMove(e);});
canvas.addEventListener('pointerup',()=>touchFire=false);canvas.addEventListener('pointercancel',()=>touchFire=false);
function pointerMove(e){const r=canvas.getBoundingClientRect();const zoom=Math.min(r.width/256,r.height/240),offsetX=(r.width-256*zoom)/2,offsetY=(r.height-240*zoom)/2;let x=(e.clientX-r.left-offsetX)/zoom,y=(e.clientY-r.top-offsetY)/zoom;player.x=clamp(x,20,232);player.y=clamp(y,51,218);}
canvas.addEventListener('contextmenu',e=>e.preventDefault());
requestAnimationFrame(loop);
})();
</script>

<script id="aster-native-window-controls">
(()=>{'use strict';
  // The original framebuffer always stays 256x240; no interpolation or squashing.
  const baseWidth=256,baseHeight=240;
  const updateGameSize=()=>{
    const scale=Math.max(1,Math.floor(Math.min(window.innerWidth/baseWidth,window.innerHeight/baseHeight)));
    document.documentElement.style.setProperty('--game-width',(baseWidth*scale)+'px');
    document.documentElement.style.setProperty('--game-height',(baseHeight*scale)+'px');
  };
  window.addEventListener('resize',updateGameSize);
  updateGameSize();

  // Tauri 2 with app.withGlobalTauri = true; pure HTML, no bundler needed.
  const nativeWindow=window.__TAURI__?.window?.getCurrentWindow?.();
  let changingFullscreen=false;
  async function toggleFullscreen(forceExit=false){
    if(changingFullscreen) return;
    changingFullscreen=true;
    try{
      if(nativeWindow){
        const isFullscreen=await nativeWindow.isFullscreen();
        if(!forceExit||isFullscreen) await nativeWindow.setFullscreen(forceExit?false:!isFullscreen);
      }else if(document.fullscreenEnabled){
        if(document.fullscreenElement) await document.exitFullscreen();
        else if(!forceExit) await document.documentElement.requestFullscreen();
      }
    }catch(err){console.error('Could not toggle fullscreen:',err)}
    finally{changingFullscreen=false;updateGameSize();}
  }
  // Capture phase runs BEFORE the game's Enter-to-start handler.
  window.addEventListener('keydown',event=>{
    if(event.altKey&&(event.code==='Enter'||event.code==='NumpadEnter')){
      event.preventDefault();event.stopImmediatePropagation();
      if(!event.repeat) void toggleFullscreen();
      return;
    }
    if(event.code==='Escape' && !event.repeat){
      // Escape is an additional way to exit fullscreen, never to enter it.
      if(nativeWindow){
        event.preventDefault();
        void toggleFullscreen(true);
      }
    }
  },true);
})();
</script>
